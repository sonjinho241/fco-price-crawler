name: price-snapshot

# 현질 도우미: 어제(D) 일별 추이 값을 D 일 개봉 기준가로 저장한다(price_snapshot_job.py).
# 대상은 콘솔에 등록된 상품에서 닿는 카드뿐이다(후보 풀 + 카드 확정 행).
#
# ⚠️ 스케줄은 꺼 두었다. "일별 추이 D 일 값 = D 일 0~1시 기준가" 가 midnight-price 워크플로로
#    확인되면 아래 schedule 주석을 푼다. 확인 전에 켜면 다른 시점 시세로 순위를 매기게 된다.

on:
  # schedule:
  #   - cron: "40 3 * * *"   # 03:40 UTC = 12:40 KST (추이에 어제 칸이 붙은 뒤)
  workflow_dispatch:
    inputs:
      limit:
        description: "테스트용 카드 수 상한 (0=전체)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: price-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect opening-day reference prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOT_LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: python price_snapshot_job.py
