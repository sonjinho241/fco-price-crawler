name: crawl-prices

# 넥슨 시세(PlayerPriceGraph) → player_price_latest·player_price_strongs.
# 공개 저장소이므로 GitHub Actions 분(分)은 무제한 → 비용 0원.
#
# ⚙️ 2026-10-30 부터 매시 한 번, 낮은 속도(전체 4 req/s 이하, 상한 5)로 조금씩 돈다.
#    예전엔 전 카드를 하루 6토막에 나눠 토막마다 35 req/s 로 92분 몰아서 보냈다(하루 116만 건).
#    2026-10-29 넥슨(Cloudflare)이 GitHub 러너의 iteminfo 수집을 429 로 막아 요청량과 시간 분포를 바꿨다.
#    hot(조회·스쿼드·팩 후보 카드)은 24시간, 나머지 tail 은 168시간에 한 바퀴(하루 약 22만 건).
#    어느 버킷을 돌지는 crawler_job.py 가 player.price_crawl_state 를 보고 정한다(밀리면 실행당 최대 3버킷).
#    설계: 메인 저장소 docs/price-crawl-two-tier-plan.md
on:
  schedule:
    # 정각은 GitHub 혼잡 시간이라 피한다. cron 이 늦거나 빠져도 다음 실행이 밀린 버킷을 메운다.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "bucket=매시 실행과 같음 / only_new=시세 표에 없는 카드 전부 / full=전 카드(5 req/s 상한이라 한 번에 안 끝난다)"
        required: false
        default: "bucket"
        type: choice
        options: [bucket, only_new, full]
      limit:
        description: "스모크용 spid 수 상한 (0=전체). 0 이 아니면 상태 표를 건드리지 않는다"
        required: false
        default: "0"
      strongs:
        description: "강화단계 (예: 1-13 / 1 / 1,5,8)"
        required: false
        default: "1-13"
      workers:
        description: "동시 요청 스레드 수"
        required: false
        default: "3"
      max_rate:
        description: "전체 초당 요청 상한 (5 를 넘기면 5)"
        required: false
        default: "4"

# 최소권한. ⚠️ pull_request 트리거는 절대 추가하지 말 것(외부 fork 의 시크릿 노출 방지).
permissions:
  contents: read

# 실행이 겹치지 않게(이전 실행이 길어지면 다음 cron 은 대기, 대기 중인 것은 최신 하나만 남는다).
concurrency:
  group: crawl-prices
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 매시 실행은 50분 예산 안에서만 다음 버킷을 시작한다. 수동 only_new·full 은 길게 둔다.
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.mode == 'bucket') && 75 || 350 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Crawl (${{ inputs.mode || 'bucket' }})
        env:
          # 🔒 DB 접속문자열(주소+비밀번호)은 코드에 절대 두지 않는다. Secret 으로만 주입.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRICE_LATEST_STRONGS: ${{ inputs.strongs || '1-13' }}
          PRICE_LATEST_WORKERS: ${{ inputs.workers || '3' }}
          PRICE_LATEST_MAX_RATE: ${{ inputs.max_rate || '4' }}
          PRICE_LATEST_LIMIT: ${{ inputs.limit || '0' }}
          PRICE_LATEST_ONLY_NEW: ${{ inputs.mode == 'only_new' && '1' || '0' }}
          PRICE_LATEST_FULL: ${{ inputs.mode == 'full' && '1' || '0' }}
        run: python crawler_job.py
